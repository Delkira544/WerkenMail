services:
  app:
    build:
      context: ..
      dockerfile: build/docker/Dockerfile.dev
    volumes:
      - ..:/app
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - GIN_MODE=debug
      - DATABASE_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: dev-ldap-admin
    ports:
      - "8081:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      openldap:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: werkenmail
      POSTGRES_USER: werkenmail
      POSTGRES_PASSWORD: werkenmail
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkenmail"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
